name: Deploy NISCO AI Worker

on:
  push:
    branches: [main]
    paths:
      - "nisco-ai/**"
      - ".github/workflows/deploy-nisco-ai.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nisco-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run NISCO AI regression tests
        run: npm test

  deploy:
    # Production deployment is restricted to the protected main branch.
    # Feature branches may run tests but cannot deploy or apply remote D1 migrations.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Deploy Worker and apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.36.0"
          workingDirectory: "nisco-ai"
          command: |
            d1 migrations apply nisco-ai-leads --remote
            deploy
