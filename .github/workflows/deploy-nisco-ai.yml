name: Deploy NISCO AI Worker

on:
  push:
    branches:
      - main
    paths:
      - "nisco-ai/**"
      - ".github/workflows/deploy-nisco-ai.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Worker and apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          workingDirectory: "nisco-ai"
          command: |
            d1 migrations apply nisco-ai-leads --remote
            deploy
