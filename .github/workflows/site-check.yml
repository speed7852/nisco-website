name: NISCO Website Checks

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "assets/**"
      - "tests/**"
      - "_headers"
      - "privacy-policy.html"
      - ".github/workflows/site-check.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  site-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run website regression tests
        run: node --test tests/site.test.js
