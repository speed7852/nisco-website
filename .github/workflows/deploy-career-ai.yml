name: Deploy NISCO Career AI

# Production deployment of the Career AI Worker, D1 migrations and Pages app.
# Safeguards (see career-ai/docs/DEPLOYMENT.md):
# - deploys only from career-ai-deploy, and only after test-career-ai.yml passes (unit and
#   integration tests, typecheck, audit, hygiene, and the browser journey);
# - runs in the "career-ai-production" GitHub Environment (configure required reviewers there);
# - never cancels a deployment in progress;
# - uses the Wrangler version pinned in career-ai/worker/package-lock.json;
# - never creates Cloudflare resources: a missing D1 database or R2 bucket stops the run;
# - stops unless the private R2 bucket has no public r2.dev URL and no custom domain (read-only);
# - records a D1 Time Travel restore point before applying migrations (read-only).
on:
  workflow_dispatch:
  push:
    branches:
      - career-ai-deploy
    paths:
      - "career-ai/**"
      - ".github/workflows/deploy-career-ai.yml"
      - ".github/workflows/test-career-ai.yml"

permissions:
  contents: read

# A deployment may be between applying a migration and deploying code. Queue, never cancel.
concurrency:
  group: nisco-career-ai-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: Typecheck and tests
    uses: ./.github/workflows/test-career-ai.yml

  deploy:
    name: Deploy to Cloudflare
    needs: checks
    # A manual dispatch from any other branch runs the checks but never deploys.
    if: github.ref == 'refs/heads/career-ai-deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: career-ai-production
      url: https://career-ai-deploy.nisco-career-ai.pages.dev
    defaults:
      run:
        working-directory: career-ai/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: career-ai/worker/package-lock.json

      - name: Install pinned Wrangler
        run: npm ci --no-audit --no-fund

      - name: Check required secrets before changing anything
        env:
          CAREER_AI_ACCESS_KEY: ${{ secrets.CAREER_AI_ACCESS_KEY }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CAREER_AI_ACCESS_KEY; do
            if [ -z "${!name:-}" ]; then echo "::error::GitHub Actions secret $name is missing."; exit 1; fi
          done

      - name: Resolve the existing D1 database (never creates one)
        run: |
          set -euo pipefail
          ids=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "nisco-career-ai-db") | .uuid')
          count=$(printf '%s\n' "$ids" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one D1 database named nisco-career-ai-db, found $count. Nothing was created."
            exit 1
          fi
          echo "Using D1 database $ids"
          # The ID is an identifier, not a secret. Commit it to wrangler.toml to remove this step.
          sed -i '/^database_name = "nisco-career-ai-db"$/a database_id = "'"$ids"'"' wrangler.toml
          grep -q "^database_id = \"$ids\"$" wrangler.toml

      - name: Check the private R2 bucket exists (never creates one)
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket list | grep -Eq '^name:[[:space:]]+nisco-career-ai-private$'; then
            echo "::error::R2 bucket nisco-career-ai-private was not found. Nothing was created."
            exit 1
          fi

      # Read-only. The expected lines are Wrangler's own output (pinned version) for "disabled" and
      # "no custom domains"; anything else, including an API error, stops the deployment.
      - name: Confirm the private R2 bucket is not publicly accessible (read-only)
        run: |
          set -euo pipefail
          dev_url=$(npx wrangler r2 bucket dev-url get nisco-career-ai-private 2>&1) || { echo "$dev_url"; echo "::error::Could not read the r2.dev URL status. Nothing was changed."; exit 1; }
          echo "$dev_url"
          if ! grep -Fxq "Public access via the r2.dev URL is disabled." <<<"$dev_url"; then
            echo "::error::Public r2.dev access is not confirmed disabled for nisco-career-ai-private. Nothing was changed; disable it in the Cloudflare dashboard, then re-run."
            exit 1
          fi
          domains=$(npx wrangler r2 bucket domain list nisco-career-ai-private 2>&1) || { echo "$domains"; echo "::error::Could not list custom domains. Nothing was changed."; exit 1; }
          echo "$domains"
          if ! grep -Fxq "There are no custom domains connected to this bucket." <<<"$domains"; then
            echo "::error::A custom domain is connected to nisco-career-ai-private. CV files must stay private. Nothing was changed."
            exit 1
          fi

      # Read-only. The bookmark lets the database be restored to the moment before this run's
      # migrations (docs/DEPLOYMENT.md, "Rolling back migration 0003").
      - name: Record a D1 restore point and the pending migrations (read-only)
        run: |
          set -euo pipefail
          info=$(npx wrangler d1 time-travel info nisco-career-ai-db --json)
          bookmark=$(jq -r '.bookmark // empty' <<<"$info")
          if [ -z "$bookmark" ]; then echo "::error::Could not read a D1 Time Travel bookmark. No migration was applied."; exit 1; fi
          echo "D1 restore point before migrations: $bookmark"
          npx wrangler d1 migrations list nisco-career-ai-db --remote
          {
            echo "### D1 restore point before migrations"
            echo ""
            echo "Bookmark: \`$bookmark\`"
            echo ""
            echo "Restore (only with an approved rollback): \`npx wrangler d1 time-travel restore nisco-career-ai-db --bookmark=$bookmark\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply nisco-career-ai-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Set the private access key secret
        env:
          CAREER_AI_ACCESS_KEY: ${{ secrets.CAREER_AI_ACCESS_KEY }}
        run: printf '%s' "$CAREER_AI_ACCESS_KEY" | npx wrangler secret put APP_ACCESS_KEY

      - name: Deploy Pages app
        working-directory: .
        run: ./career-ai/worker/node_modules/.bin/wrangler pages deploy career-ai/frontend --project-name nisco-career-ai --branch career-ai-deploy --commit-dirty=true
