name: Deploy NISCO Career AI

on:
  workflow_dispatch:
  push:
    branches:
      - career-ai-deploy
    paths:
      - "career-ai/**"
      - ".github/workflows/deploy-career-ai.yml"

permissions:
  contents: read

concurrency:
  group: nisco-career-ai-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Provision private D1 and R2 resources and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save wrangler@4
          echo "Finding Career AI D1 database"
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="nisco-career-ai-db") | .uuid' | head -1)
          if [ -z "$DB_ID" ]; then
            echo "Creating Career AI D1 database"
            npx wrangler d1 create nisco-career-ai-db
            DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="nisco-career-ai-db") | .uuid' | head -1)
          fi
          test -n "$DB_ID" || { echo "D1 database ID not found"; exit 1; }
          echo "Ensuring private Career AI R2 bucket exists"
          if ! npx wrangler r2 bucket list --json | jq -e '.[] | select(.name=="nisco-career-ai-private")' >/dev/null; then
            npx wrangler r2 bucket create nisco-career-ai-private
          fi
          sed -i '/database_name = "nisco-career-ai-db"/a database_id = "'"${DB_ID}"'"' career-ai/worker/wrangler.toml
          sed -i '/binding = "PRIVATE_FILES"/a bucket_name = "nisco-career-ai-private"' career-ai/worker/wrangler.toml
          npx wrangler d1 migrations apply nisco-career-ai-db --remote --config career-ai/worker/wrangler.toml
          npx wrangler deploy --config career-ai/worker/wrangler.toml

      - name: Configure private application access key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CAREER_AI_ACCESS_KEY: ${{ secrets.CAREER_AI_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CAREER_AI_ACCESS_KEY:-}" ]; then
            echo "CAREER_AI_ACCESS_KEY GitHub Actions secret is missing."
            exit 1
          fi
          printf '%s' "$CAREER_AI_ACCESS_KEY" | npx wrangler secret put APP_ACCESS_KEY --config career-ai/worker/wrangler.toml


      - name: Deploy Career AI Pages preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy career-ai/frontend --project-name nisco-career-ai --branch career-ai-deploy
