name: Test NISCO India Website
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "assets/**"
      - "tests/site.test.js"
      - "nisco-ai/**"
      - ".github/workflows/test-nisco-site.yml"
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "script.js"
      - "assets/**"
      - "tests/site.test.js"
      - ".github/workflows/test-nisco-site.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run NISCO website regression tests
        run: |
          node --check script.js
          node --check assets/nisco-chat.js
          node --check assets/nisco-india-config.js
          node --check nisco-ai/src/index.js
          node --test tests/site.test.js nisco-ai/src/index.test.js
