name = "nisco-ai"
main = "src/index.js"
compatibility_date = "2026-11-09"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://nisco-website.pages.dev"
BREVO_SENDER_EMAIL = "nisco.in@outlook.com"

[[d1_databases]]
binding = "DB"
database_name = "nisco-ai-leads"
database_id = "aeea79a1-c8ea-46b9-a0ec-6ff546a9d218"
migrations_dir = "migrations"

[observability]
enabled = true

[ai]
binding = "AI"

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "2026111001"
  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "ENQUIRY_RATE_LIMITER"
namespace_id = "2026111002"
  [ratelimits.simple]
  limit = 5
  period = 60

[triggers]
crons = ["17 2 * * *"]
